# params.json 对齐协议（协议仓 fullstack-param-protocol，schema v2 两区）
#   verify job（硬门槛，失败阻止合并）：
#     1) vendor 指纹自检：bin/gen-params.py == bin/GEN_PARAMS_VERSION（与协议仓同源）
#     2) 双区校验（gen-params --verify 一并覆盖）：
#        - params 区 == copier.yml（hash 自检）
#        - selection 区 schema 校验（策展、不参与 copier hash，非法即失败）
#   notify-drift job（软信号）：params.json 变化 → 跨仓 dispatch 桥 check-drift workflow
#
# notify-drift 启用前置（未配置则自动跳过，不破坏 CI）：
#   - 桥仓已有 check-drift.yml
#   - 仓库 Variables: DRIFT_DISPATCH_ENABLED = true
#   - 仓库 Secrets: BRIDGE_DISPATCH_TOKEN（带 fullstack-bridge 仓库 workflow 触发权的 PAT）
name: params-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 copier（钉 9.17.1，与协议仓 venv / 底座钩子统一）
        run: pip install copier==9.17.1
      - name: vendor 指纹自检（gen-params.py 与协议仓同源）
        run: |
          test "$(sha256sum bin/gen-params.py | cut -d' ' -f1)" = "$(cat bin/GEN_PARAMS_VERSION)" \
            || { echo "❌ bin/gen-params.py 与 bin/GEN_PARAMS_VERSION 不一致（升级 gen-params.py = 从协议仓复制 + 更新标记）"; exit 1; }
      - name: 双区自检（params ↔ copier.yml hash + selection schema）
        run: python bin/gen-params.py --template-dir template --output params.json --verify

  notify-drift:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DRIFT_DISPATCH_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 探测 params.json 变化
        id: changed
        run: |
          if git diff HEAD^ HEAD --name-only | grep -q '^params.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 信号 → 桥 check-drift workflow
        if: steps.changed.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          DISPATCH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
          script: |
            const repo = '${{ github.event.repository.name }}';
            const sha = '${{ github.sha }}';
            console.log(`信号: base_repo=${repo} base_version=${sha}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'jianghua-developer',
              repo: 'fullstack-bridge',
              workflow_id: 'check-drift.yml',
              ref: 'refs/heads/main',
              inputs: { base_repo: repo, base_version: sha },
            });
